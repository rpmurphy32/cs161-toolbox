<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval Scheduling · CS161</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#0B1120}
  #root{min-height:100vh}
  body{color:#E6EDF7;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 56px}
  h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
  .sub{font-size:13px;color:#8194B0;margin:6px 0 0}
  .panel{background:#151E31;border:1px solid #2A3752;border-radius:10px}
  .btn{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid #2A3752;background:#151E31;color:#E6EDF7;cursor:pointer;transition:opacity .15s,border-color .15s,background .15s}
  .btn:disabled{opacity:.4;cursor:default}
  .btn:focus-visible,input:focus-visible{outline:2px solid #5B8DEF;outline-offset:2px}
  input[type=range]{accent-color:#5B8DEF}
  .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8194B0}
  svg{display:block;width:100%;height:auto}
  @media (prefers-reduced-motion: reduce){*{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

/* palette */
const C = {
  bg:"#0B1120", panel:"#151E31", ink:"#E6EDF7", mute:"#8194B0", line:"#2A3752",
  blue:"#5B8DEF", green:"#2DD4A0", amber:"#F0A73C", coral:"#FF6B6B",
  idle:"#1C2942", fill:"#10192B", onDark:"#0B1120", code:"#A7B6CE", dim:"#4A5A78",
};
const LABELS = "ABCDEFGH".split("");

/* ------- dom helpers ------- */
function h(tag, props, kids){
  const e=document.createElement(tag); props=props||{};
  for(const k in props){ const v=props[k]; if(v===null||v===undefined||v===false) continue;
    if(k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if(k==="class") e.setAttribute("class",v);
    else if(k.startsWith("on")&&typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v); }
  (Array.isArray(kids)?kids:[kids]).forEach(function push(c){ if(c===null||c===undefined||c===false) return;
    if(Array.isArray(c)){c.forEach(push);return;} e.appendChild(c.nodeType?c:document.createTextNode(String(c))); });
  return e;
}
const SVGNS="http://www.w3.org/2000/svg";
function S(tag, props, kids){
  const e=document.createElementNS(SVGNS,tag); props=props||{};
  for(const k in props){ const v=props[k]; if(v===null||v===undefined||v===false) continue;
    if(k.startsWith("on")&&typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v); }
  (Array.isArray(kids)?kids:[kids]).forEach(function push(c){ if(c===null||c===undefined||c===false) return;
    if(Array.isArray(c)){c.forEach(push);return;} e.appendChild(c.nodeType?c:document.createTextNode(String(c))); });
  return e;
}

/* ------- model ------- */
const overlap=(a,b)=> a.s<b.f && b.s<a.f;

function relabel(list){ // accept [s,f] pairs; sort by start for stable display, assign labels
  const rows=list.map((iv)=>({s:iv[0], f:iv[1]}));
  rows.sort((a,b)=>a.s-b.s||a.f-b.f);
  rows.forEach((r,i)=>{ r.id=i; r.label=LABELS[i]; });
  return rows;
}

const PRESETS={
  classic:   [[0,3],[2,5],[4,7],[1,6],[6,9],[8,11]],
  shortest:  [[0,4],[3,6],[5,9]],            // shortest-first trap
  blocking:  [[0,10],[1,3],[4,6],[7,9]],     // earliest-start AND latest-finish trap
};

function randomSet(seed){
  // simple LCG from seed
  let x=seed>>>0; const rnd=()=>{ x=(x*1664525+1013904223)>>>0; return x/4294967296; };
  const n=5+Math.floor(rnd()*3); // 5..7
  const T=12; const out=[];
  for(let i=0;i<n;i++){ const s=Math.floor(rnd()*(T-2)); const len=1+Math.floor(rnd()*4); out.push([s,Math.min(T,s+len)]); }
  return out;
}

/* DP take/skip -> optimal count + trace pieces */
function dpSolve(rows){
  const g=[...rows].sort((a,b)=>a.s-b.s||a.f-b.f);
  const n=g.length;
  const next=Array(n).fill(n);
  for(let i=0;i<n;i++){ for(let j=i+1;j<n;j++){ if(g[j].s>=g[i].f){ next[i]=j; break; } } }
  const best=Array(n+1).fill(0), choice=Array(n).fill("skip");
  for(let i=n-1;i>=0;i--){ const skip=best[i+1], take=1+best[next[i]]; best[i]=Math.max(skip,take); choice[i]= take>skip?"take":"skip"; }
  return {g,n,next,best,choice,opt:best[0]};
}
const optimalCount=(rows)=> dpSolve(rows).opt;

const RULES={
  shortest:      {label:"Shortest first",  cmp:(a,b)=>(a.f-a.s)-(b.f-b.s)||a.s-b.s},
  earliestStart: {label:"Earliest start",  cmp:(a,b)=>a.s-b.s||a.f-b.f},
  latestStart:   {label:"Latest start",    cmp:(a,b)=>b.s-a.s||b.f-a.f},
  earliestFinish:{label:"Earliest finish", cmp:(a,b)=>a.f-b.f||a.s-b.s},
  latestFinish:  {label:"Latest finish",   cmp:(a,b)=>b.f-a.f||b.s-a.s},
};

function buildGreedy(rows, ruleKey){
  const rule=RULES[ruleKey];
  const order=[...rows].sort(rule.cmp);
  const opt=optimalCount(rows);
  const steps=[]; const sel=new Set(), elim=new Set(); const chosen=[];
  const snap=(o)=>steps.push({mode:"greedy", order:order.map(r=>r.id), sel:new Set(sel), elim:new Set(elim), ...o});
  snap({considering:null, msg:`Rule: ${rule.label}. Order the meetings by this rule, scan left to right, and keep each one that does not conflict with those already kept.`});
  for(const iv of order){
    snap({considering:iv.id, msg:`Consider ${iv.label} [${iv.s}, ${iv.f}).`});
    const clash=chosen.find(c=>overlap(c,iv));
    if(!clash){ chosen.push(iv); sel.add(iv.id); snap({considering:iv.id, msg:`${iv.label} does not overlap any kept meeting. Keep it.`}); }
    else { elim.add(iv.id); snap({considering:iv.id, msg:`${iv.label} overlaps ${clash.label}, which is already kept. Skip it.`}); }
  }
  const got=chosen.length;
  const verdict = got===opt ? `That equals the optimum, so this rule is optimal on this set.`
    : `The optimum is ${opt}, so this rule is NOT optimal here. Try a different rule to see one that matches.`;
  snap({considering:null, done:true, count:got, opt, msg:`Done. ${rule.label} kept ${got} meeting${got===1?"":"s"}. ${verdict}`});
  return steps;
}

function buildDp(rows){
  const {g,n,next,best,choice}=dpSolve(rows);
  const steps=[]; const filled=Array(n+1).fill(null); filled[n]=0;
  const snap=(o)=>steps.push({mode:"dp", gOrder:g.map(r=>r.id), filled:filled.slice(), next, sel:new Set(o.sel||[]), ...o});
  snap({iFill:null, msg:`Sort by start time (left to right below). Fill best(i) from the last meeting backward. best(i) = max( skip = best(i+1),  take = 1 + best(next(i)) ), where next(i) is the first later meeting that does not conflict with i.`});
  for(let i=n-1;i>=0;i--){
    const skip=best[i+1], nx=next[i], take=1+best[nx];
    filled[i]=best[i];
    const nxName = nx===n ? "end" : g[nx].label;
    snap({iFill:i, skipVal:skip, takeVal:take, nx, chosen:choice[i],
      msg:`best(${i}) for ${g[i].label}: skip = best(${i+1}) = ${skip}; take = 1 + best(${nx===n?"end":nxName}) = ${take}. Take max: best(${i}) = ${best[i]} (${choice[i]}).`});
  }
  // reconstruct
  const sel=new Set();
  snap({iFill:0, reconstruct:true, sel:[...sel], msg:`Reconstruct the schedule by following the choices from best(0). Total = ${best[0]} meeting${best[0]===1?"":"s"}.`});
  let i=0;
  while(i<n){
    if(choice[i]==="take"){ sel.add(g[i].id); const nx=next[i];
      snap({iFill:i, reconstruct:true, cur:g[i].id, sel:[...sel], msg:`Take ${g[i].label}, then jump to ${nx===n?"the end":g[nx].label}.`});
      i=nx;
    } else { snap({iFill:i, reconstruct:true, cur:g[i].id, sel:[...sel], msg:`Skip ${g[i].label} (best(${i+1}) was at least as good).`}); i=i+1; }
  }
  snap({reconstruct:true, done:true, sel:[...sel], count:best[0], opt:best[0], msg:`Done. An optimal schedule keeps ${best[0]} meeting${best[0]===1?"":"s"}, shown in green.`});
  return steps;
}

/* ------- pseudocode (original paraphrase), one block per mode ------- */
const SORT_WORDS = {
  shortest:       "shortest duration first",
  earliestStart:  "earliest start time first",
  latestStart:    "latest start time first",
  earliestFinish: "earliest finish time first",
  latestFinish:   "latest finish time first",
};
const greedyCode = (ruleKey)=>[
  "order the meetings, " + (SORT_WORDS[ruleKey] || "by the chosen rule"),
  "scan them in that order; for each meeting:",
  "    if it clashes with nothing kept so far, keep it",
  "    otherwise skip it - a kept meeting already owns that time",
  "done: the kept meetings are the schedule; count them",
];
const DP_CODE = [
  "order the meetings by start time",
  "work backward, from the last meeting to the first:",
  "    best(i) = the better of:  skip meeting i  (worth best(i+1))",
  "              or take it  (worth 1 + best of the next meeting that fits)",
  "the optimal count is best(0)",
  "replay the take/skip choices forward from the top to recover a schedule",
];
function codeFor(st, selSet, elim){
  if(st.mode==="dp"){
    let hi;
    if(st.reconstruct) hi = st.cur!=null ? [5] : [4,5];
    else if(st.iFill===null) hi = [0,1];
    else hi = [2,3];
    return { code:DP_CODE, hi };
  }
  let hi;
  if(st.done) hi=[4];
  else if(st.considering==null) hi=[0];
  else if(selSet.has(st.considering)) hi=[2];
  else if(elim.has(st.considering)) hi=[3];
  else hi=[1,2];
  return { code:greedyCode(state.mode), hi };
}

/* ------- state ------- */
const state = { rows: relabel(PRESETS.classic), mode:"earliestFinish", idx:0, playing:false, speed:4, seed:12345 };
let steps = buildGreedy(state.rows, state.mode);
let playTimer=null;

function rebuild(){
  steps = state.mode==="dp" ? buildDp(state.rows) : buildGreedy(state.rows, state.mode);
  state.idx=0; state.playing=false;
}
function setSet(rows){ state.rows=relabel(rows); rebuild(); }

/* ------- layout constants ------- */
const TL_W=720, ROWH=34, TL_TOP=40, TL_BOT=14, MARGIN_L=44, MARGIN_R=18;
function tlHeight(n){ return TL_TOP + n*ROWH + TL_BOT; }

/* ------- render ------- */
function render(){
  if(playTimer){ clearTimeout(playTimer); playTimer=null; }
  if(state.idx>steps.length-1) state.idx=steps.length-1;
  if(state.idx<0) state.idx=0;
  const st=steps[state.idx];
  if(state.playing){
    if(state.idx>=steps.length-1) state.playing=false;
    else playTimer=setTimeout(()=>{ state.idx+=1; render(); }, 1100-state.speed*90);
  }

  const rows=state.rows, n=rows.length;
  const Tmax=Math.max(...rows.map(r=>r.f));
  const xOf=(t)=> MARGIN_L + (t/Tmax)*(TL_W-MARGIN_L-MARGIN_R);
  const rowIndex={}; rows.forEach((r,i)=>rowIndex[r.id]=i);

  const selSet = st.mode==="dp" ? new Set(st.sel||[]) : (st.sel||new Set());
  const elim = st.elim||new Set();

  /* ---- header ---- */
  const header = h("div",{style:{marginBottom:"16px"}},[
    h("h1",{},"Interval Scheduling"),
    h("p",{class:"sub"},"Keep the maximum number of non-overlapping meetings. Compare five greedy rules against the take-or-skip DP, and watch which rules match the optimum and which get trapped."),
  ]);

  /* ---- set + rule pickers ---- */
  const presetBtn=(key,label)=>h("button",{class:"btn",onclick:()=>{ setSet(PRESETS[key]); render(); }},label);
  const setBar = h("div",{class:"panel",style:{padding:"10px 12px",marginBottom:"12px"}},[
    h("div",{style:{display:"flex",flexWrap:"wrap",gap:"8px",alignItems:"center"}},[
      h("span",{class:"lbl",style:{marginRight:"2px"}},"Meetings"),
      presetBtn("classic","Classic"),
      presetBtn("shortest","Shortest-first trap"),
      presetBtn("blocking","Blocking-meeting trap"),
      h("button",{class:"btn",onclick:()=>{ state.seed=(state.seed*1103515245+12345)>>>0; setSet(randomSet(state.seed)); render(); }},"Random set"),
    ]),
  ]);

  const modeBtn=(key,label)=>{
    const active=state.mode===key;
    return h("button",{class:"btn",style:{borderColor:active?C.blue:C.line,background:active?C.blue:C.panel,color:active?C.onDark:C.ink},
      onclick:()=>{ state.mode=key; rebuild(); render(); }},label);
  };
  const ruleBar = h("div",{class:"panel",style:{padding:"10px 12px",marginBottom:"12px"}},[
    h("div",{style:{display:"flex",flexWrap:"wrap",gap:"8px",alignItems:"center"}},[
      h("span",{class:"lbl",style:{marginRight:"2px"}},"Method"),
      modeBtn("shortest","Shortest first"),
      modeBtn("earliestStart","Earliest start"),
      modeBtn("latestStart","Latest start"),
      modeBtn("earliestFinish","Earliest finish"),
      modeBtn("latestFinish","Latest finish"),
      modeBtn("dp","Take/skip DP"),
    ]),
  ]);

  /* ---- timeline ---- */
  const H=tlHeight(n);
  const gEls=[];
  // axis
  gEls.push(S("line",{x1:MARGIN_L,y1:TL_TOP-12,x2:TL_W-MARGIN_R,y2:TL_TOP-12,stroke:C.line,"stroke-width":1}));
  for(let t=0;t<=Tmax;t++){
    gEls.push(S("line",{x1:xOf(t),y1:TL_TOP-15,x2:xOf(t),y2:TL_TOP-9,stroke:C.line,"stroke-width":1}));
    gEls.push(S("text",{x:xOf(t),y:TL_TOP-20,"text-anchor":"middle","font-size":10,fill:C.dim,class:"mono"},String(t)));
  }
  rows.forEach((r,i)=>{
    const y=TL_TOP + i*ROWH;
    const isSel=selSet.has(r.id), isElim=elim.has(r.id), isCur=st.considering===r.id || st.cur===r.id;
    let barFill=C.idle, barStroke=C.line, txt=C.code;
    if(isSel){ barFill=C.green; barStroke=C.green; txt=C.onDark; }
    else if(isCur){ barFill=C.amber; barStroke=C.amber; txt=C.onDark; }
    else if(isElim){ barFill=C.fill; barStroke=C.coral; txt=C.dim; }
    gEls.push(S("text",{x:14,y:y+16,"text-anchor":"middle","font-size":13,"font-weight":700,fill:isSel?C.green:isCur?C.amber:C.mute,class:"mono"},r.label));
    const x1=xOf(r.s), x2=xOf(r.f);
    gEls.push(S("rect",{x:x1,y:y+2,width:Math.max(2,x2-x1),height:22,rx:5,fill:barFill,stroke:barStroke,"stroke-width":1.5,
      "stroke-dasharray":isElim?"4 3":"none"}));
    gEls.push(S("text",{x:(x1+x2)/2,y:y+17,"text-anchor":"middle","font-size":11,fill:txt,class:"mono"},`[${r.s},${r.f})`));
  });
  const timeline = h("div",{class:"panel",style:{padding:"12px",marginBottom:"12px"}},[
    h("div",{class:"lbl",style:{marginBottom:"6px"}},"Timeline"),
    S("svg",{viewBox:`0 0 ${TL_W} ${H}`,role:"img","aria-label":"meetings on a timeline"},gEls),
  ]);

  /* ---- DP table (dp mode only, fixed area either way to avoid jump) ---- */
  let dpArea;
  if(st.mode==="dp"){
    const g = st.gOrder.map(id=>rows[rowIndex[id]]);
    const cells=[];
    for(let i=0;i<=g.length;i++){
      const val = st.filled[i];
      const isCur = st.iFill===i;
      const isSkipSrc = st.iFill!=null && i===st.iFill+1 && !st.reconstruct;
      const isTakeSrc = st.iFill!=null && i===st.nx && !st.reconstruct;
      let bg=C.idle, bd=C.line, tc=C.code;
      if(isCur){ bg=C.amber; bd=C.amber; tc=C.onDark; }
      else if(isSkipSrc){ bg=C.fill; bd=C.blue; tc=C.blue; }
      else if(isTakeSrc){ bg=C.fill; bd=C.green; tc=C.green; }
      cells.push(h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}},[
        h("div",{class:"mono",style:{width:"46px",height:"40px",display:"flex",alignItems:"center",justifyContent:"center",
          borderRadius:"6px",border:"1px solid "+bd,background:bg,color:tc,fontSize:"15px",fontWeight:600}}, val===null?"":String(val)),
        h("div",{class:"mono",style:{fontSize:"11px",color:C.mute}}, i===g.length?"end":g[i].label),
      ]));
    }
    dpArea = h("div",{class:"panel",style:{padding:"12px",marginBottom:"12px",minHeight:"92px"}},[
      h("div",{class:"lbl",style:{marginBottom:"8px"}},"best(i) table, sorted by start time"),
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:"6px"}},cells),
    ]);
  } else {
    // greedy: show the rule order as chips, fixed-height area
    const order=st.order.map(id=>rows[rowIndex[id]]);
    const chips=order.map((r)=>{
      const isSel=selSet.has(r.id), isCur=st.considering===r.id, isElim=elim.has(r.id);
      let bg=C.idle,bd=C.line,tc=C.code;
      if(isSel){bg=C.green;bd=C.green;tc=C.onDark;} else if(isCur){bg=C.amber;bd=C.amber;tc=C.onDark;} else if(isElim){bg=C.fill;bd=C.coral;tc=C.dim;}
      return h("span",{class:"mono",style:{padding:"4px 8px",borderRadius:"6px",border:"1px solid "+bd,background:bg,color:tc,fontSize:"13px",fontWeight:600}},r.label);
    });
    dpArea = h("div",{class:"panel",style:{padding:"12px",marginBottom:"12px",minHeight:"92px"}},[
      h("div",{class:"lbl",style:{marginBottom:"8px"}},"Scan order (by "+RULES[state.mode].label.toLowerCase()+")"),
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:"6px",alignItems:"center"}},chips),
    ]);
  }

  /* ---- message ---- */
  const message = h("div",{style:{fontSize:"14px",color:C.mute,minHeight:"44px",marginBottom:"12px",lineHeight:"1.5"}}, st.msg);

  /* ---- controls ---- */
  const atEnd=state.idx>=steps.length-1;
  const controls = h("div",{class:"panel",style:{padding:"12px",marginBottom:"12px"}},[
    h("div",{style:{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}},[
      h("button",{class:"btn",style:{borderColor:C.blue,background:C.blue,color:C.onDark},disabled:atEnd?"disabled":null,
        onclick:()=>{ if(state.playing){state.playing=false;render();return;} if(atEnd)state.idx=0; state.playing=true; render(); }}, state.playing?"Pause":"Play"),
      h("button",{class:"btn",disabled:atEnd?"disabled":null,onclick:()=>{ state.playing=false; if(state.idx<steps.length-1)state.idx+=1; render(); }},"Step"),
      h("button",{class:"btn",disabled:state.idx===0?"disabled":null,onclick:()=>{ state.playing=false; state.idx-=1; render(); }},"Back"),
      h("button",{class:"btn",onclick:()=>{ state.playing=false; state.idx=0; render(); }},"Reset"),
      h("span",{class:"lbl",style:{marginLeft:"8px"}},"Speed"),
      h("input",{type:"range",min:"1",max:"10",value:String(state.speed),style:{width:"120px"},oninput:(e)=>{ state.speed=+e.target.value; }}),
      h("span",{style:{fontSize:"12px",color:C.mute,marginLeft:"auto"},class:"mono"},"step "+(state.idx+1)+" / "+steps.length),
    ]),
  ]);

  /* ---- pseudocode, synced to the current step ---- */
  const pc = codeFor(st, selSet, elim);
  const codePanel = h("div",{class:"panel",style:{padding:"12px",marginBottom:"12px",overflowX:"auto"}},[
    h("div",{class:"lbl",style:{marginBottom:"6px"}},"The algorithm in words"),
    h("div",{}, pc.code.map((ln,k)=>{
      const on = pc.hi.includes(k);
      return h("div",{class:"mono",style:{
        whiteSpace:"pre", fontSize:"12.5px", lineHeight:"1.7", padding:"1px 8px",
        borderLeft: on ? "3px solid "+C.amber : "3px solid transparent",
        background: on ? "rgba(240,167,60,0.14)" : "transparent",
        color: on ? C.ink : C.code, fontWeight: on ? 600 : 400 }}, ln);
    })),
  ]);

  /* ---- footnote ---- */
  const foot = h("div",{class:"panel",style:{padding:"12px",fontSize:"12.5px",color:C.mute,lineHeight:"1.6"}},[
    h("p",{style:{margin:"0 0 8px"}},[h("span",{style:{color:C.ink,fontWeight:600}},"The lesson: "),"greedy only works with the right rule. This tool checks every rule against the DP's true optimum, so you can see exactly which rules get trapped and on which meetings."]),
    h("p",{style:{margin:"0 0 8px"}},[h("span",{style:{color:C.green,fontWeight:600}},"Always optimal: "),"Earliest finish - the course proves it with an iterative exchange argument (swap the optimum's first meeting for the earliest-finishing one; no conflicts appear). Latest start is earliest-finish mirrored in time, so it is equally reliable - though the course only wrote the proof for earliest-finish."]),
    h("p",{style:{margin:"0 0 8px"}},[h("span",{style:{color:C.coral,fontWeight:600}},"Can fail: "),"Shortest first, Earliest start, and Latest finish each have counterexamples - the presets above trap every one of them."]),
    h("p",{style:{margin:0}},[h("span",{style:{color:C.ink,fontWeight:600}},"Why the DP is efficient: "),"sorting by start time makes every subproblem a suffix of the meetings (the supplemental handout's argument - conflicts form a contiguous block), so there are only n+1 distinct subproblems (not 2^n). Computing every best(i) value therefore takes polynomial time - O(n²) - instead of exponential."]),
  ]);

  const wrap=h("div",{class:"wrap"},[header,setBar,ruleBar,timeline,dpArea,message,controls,codePanel,foot]);
  const root=document.getElementById("root"); root.textContent=""; root.appendChild(wrap);
}

render();
</script>
</body>
</html>
